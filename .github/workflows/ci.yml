name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...

  web:
    name: Web client (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  smoke:
    name: Smoke test (client against server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and start the server
        working-directory: server
        run: |
          go build -o "$RUNNER_TEMP/cardwarsd" ./cmd/cardwarsd
          "$RUNNER_TEMP/cardwarsd" -bot-delay 1ms -addr :8080 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
      - name: Play whole games through the picker
        working-directory: web
        run: node test/smoke.mjs http://localhost:8080 24
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: web
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
