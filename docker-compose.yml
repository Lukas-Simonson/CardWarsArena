name: cardwars
# Card Wars: the game server plus the web client behind one port.
#   docker compose pull && docker compose up -d      # the images CI publishes from main
#   docker compose up -d --build                     # or build them from this checkout
# then point your reverse proxy (or a browser) at port 8088.
services:
  server:
    image: ghcr.io/lukas-simonson/cardwarstcg-server:latest
    build: ./server
    command: ["-db", "/var/lib/cardwars/cardwars.db"]
    # Sign-in is off unless these are set (see .env.example).
    environment:
      CARDWARS_AUTH: ${CARDWARS_AUTH:-none}
      CARDWARS_PUBLIC_URL: ${CARDWARS_PUBLIC_URL:-}
      CARDWARS_DISCORD_CLIENT_ID: ${CARDWARS_DISCORD_CLIENT_ID:-}
      CARDWARS_DISCORD_CLIENT_SECRET: ${CARDWARS_DISCORD_CLIENT_SECRET:-}
      CARDWARS_GITHUB_CLIENT_ID: ${CARDWARS_GITHUB_CLIENT_ID:-}
      CARDWARS_GITHUB_CLIENT_SECRET: ${CARDWARS_GITHUB_CLIENT_SECRET:-}
    restart: unless-stopped
    read_only: true
    volumes:
      - cardwars-data:/var/lib/cardwars
  web:
    image: ghcr.io/lukas-simonson/cardwarstcg-web:latest
    build: ./web
    restart: unless-stopped
    depends_on: [server]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]  # through the proxy to the game server
      interval: 30s
    ports:
      - "8088:80"

volumes:
  cardwars-data:
